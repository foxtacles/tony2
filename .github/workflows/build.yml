name: Build

on: [push, pull_request]

jobs:
  fetch-deps:
    name: Download original binaries
    uses: ./.github/workflows/tony2bin.yml

  build-current-toolchain:
    name: Current MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Setup Ninja
        uses: ./.github/actions/setup-ninja

      - name: Setup vcvars
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '21'

      - name: Build
        run: |
          cmake -S . -B build -GNinja `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Debug `
            -DENABLE_CLANG_TIDY=ON `
            -Werror=dev
          cmake --build build -- -k0

  build:
    name: 'MSVC 5.0'
    runs-on: windows-latest

    steps:
    - name: 'Checkout tony2 sources'
      uses: actions/checkout@v6

    - name: 'Checkout MSVC5 SP3 toolchain (game code)'
      uses: actions/checkout@v6
      with:
        repository: archaic-msvc/msvc500sp3
        path: msvc500

    - name: 'Checkout MSVC6 RTM toolchain (GSM voice codec TUs)'
      uses: actions/checkout@v6
      with:
        repository: archaic-msvc/msvc600
        path: msvc600

    - name: 'Complete the VC5 toolchain'
      shell: cmd
      run: |
        rem The stripped VC5 SP3 package omits SHLWAPI; borrow the headers/libs from
        rem the VC6 package (identical vintage) so the game code can link against it.
        copy /y msvc600\VC98\Include\SHLWAPI.H msvc500\include\ >nul
        copy /y msvc600\VC98\Lib\SHLWAPI.LIB   msvc500\lib\     >nul
        rem link.exe loads msdis100.dll, which needs msvcp50.dll beside it on PATH.
        copy /y msvc500\redist\msvcp50.dll     msvc500\bin\     >nul

    - name: Build
      shell: cmd
      run: |
        call .\msvc500\bin\VCVARS32.BAT
        cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DTONY2_VC6_DIR=${{ github.workspace }}/msvc600" -G "NMake Makefiles"
        cmake --build build

    - name: Upload Artifact
      uses: actions/upload-artifact@main
      with:
        name: Win32
        path: |
          build/TONY2.EXE
          build/TONY2.pdb

  verify:
    name: Verify decomp
    needs: [build, fetch-deps]
    runs-on: windows-latest
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - uses: actions/download-artifact@v8
      with:
       name: Win32
       path: build

    - name: Restore cached original binaries
      id: cache-original-binaries
      uses: actions/cache/restore@v5
      with:
        enableCrossOsArchive: true
        path: tony2bin
        key: tony2bin

    - name: Install python packages
      shell: bash
      run: |
        pip install -r tools/requirements.txt

    - name: Detect binaries
      id: detection
      run: |
        reccmp-project detect --what original   --search-path tony2bin
        reccmp-project detect --what recompiled --search-path build

    - name: Summarize Accuracy
      shell: bash
      run: |
        reccmp-reccmp -S TONY2PROGRESS.SVG --target TONY2 --nolib --json TONY2PROGRESS.json --html TONY2PROGRESS.HTML

    - name: Compare Accuracy With Current Master
      shell: bash
      env:
        RELEASE_URL: https://github.com/foxtacles/tony2/releases/download/continuous
      run: |
        curl -fLSs -o TONY2PROGRESS-old.json $RELEASE_URL/TONY2PROGRESS.json || echo "" >TONY2PROGRESS-old.json

        (reccmp-reccmp --target TONY2 --nolib --diff TONY2PROGRESS-old.json || echo "Current master not found")>"TONY2-diff.txt"

        cat TONY2-diff.txt

    - name: Check Vtables
      if: ${{ steps.detection.conclusion == 'success' && always() }}
      shell: bash
      run: |
        reccmp-vtable --target TONY2

    - name: Check Variables
      if: ${{ steps.detection.conclusion == 'success' && always() }}
      shell: bash
      run: |
        reccmp-datacmp --target TONY2

    - name: Check Folding
      if: ${{ steps.detection.conclusion == 'success' && always() }}
      shell: bash
      run: |
        python tools/check_folded.py --target TONY2

    - name: 'Create comment on PR'
      if: ${{ github.event_name == 'pull_request' }}
      shell: sh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        section() {
          echo "## $1"
          echo '```'
          if [ -f "$2" ]; then
            sed -i -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$2"
            python -c "print(open('$2').read().strip())";
          else
            echo '(no diff available)';
          fi
          echo '```'
        }

        {
          echo '# reccmp report'
          section 'TONY2 (TONY2.EXE)' TONY2-diff.txt
        } >reccmp-pr-message.txt

        echo "${{ github.event.number }}" >pr-number.txt

        cat reccmp-pr-message.txt

    - name: Upload Artifact
      uses: actions/upload-artifact@main
      with:
        name: Accuracy Report
        path: |
          TONY2PROGRESS*

    - name: Upload PR comment payload
      if: ${{ github.event_name == 'pull_request' && always() }}
      uses: actions/upload-artifact@main
      with:
        name: reccmp-pr-comment
        path: |
          reccmp-pr-message.txt
          pr-number.txt

  upload:
    name: Upload artifacts
    needs: [verify]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'foxtacles/tony2' }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v6
      with:
        repository: probonopd/uploadtool

    - uses: actions/download-artifact@v8
      with:
       name: Win32
       path: build

    - uses: actions/download-artifact@v8
      with:
        name: Accuracy Report

    - name: Upload Continuous Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./upload.sh \
          build/TONY2.EXE \
          TONY2PROGRESS*

    - name: Prepare Pages
      run: |
        mkdir -p progress
        cp TONY2PROGRESS.SVG progress/
        cp TONY2PROGRESS.HTML progress/

    - uses: actions/upload-pages-artifact@v3
      with:
        path: progress/

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v5

  decomplint:
    name: ${{ matrix.module }} annotations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: TONY2
            path: TONY2 util
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install python libraries
        id: install
        run: |
          pip install -r tools/requirements.txt

      - name: Run decomplint
        if: ${{ steps.install.conclusion == 'success' && always() }}
        run: |
          reccmp-decomplint ${{ matrix.path }} --module ${{ matrix.module }} --warnfail

      - name: Check address padding
        if: ${{ steps.install.conclusion == 'success' && always() }}
        run: |
          python tools/reccmp_addr_padding.py

  clang-format:
    name: c++ clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run clang-format
        run: |
          find TONY2 util -iname '*.h' -o -iname '*.cpp' | xargs \
          pipx run "clang-format>=22,<23" \
            --style=file \
            -i
          git diff --color --exit-code

  naming:
    name: Naming conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '21'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install python libraries
        run: |
          pip install clang==21.* pyyaml

      - name: Run ncc
        run: |
          python3 tools/ncc/ncc.py \
            --clang-lib ${{ env.LLVM_PATH }}/lib/libclang.so \
            --recurse \
            --style tools/ncc/ncc.style \
            --skip tools/ncc/skip.yml \
            --definition DEFINE_GUID PASCAL WINAPI FAR BOOL CALLBACK HWND__=HWND \
            --include \
              util \
              TONY2/include \
              TONY2 \
            --path TONY2
